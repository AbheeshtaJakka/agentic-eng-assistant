[project]
name = "agentic-eng-assistant"
version = "0.1.0"
description = "Production-style multi-agent AI engineering assistant: issue in, reviewed and tested pull request out."
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pytest>=8",  # also used at runtime by the eval harness to run hidden tests
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "httpx>=0.27", "mypy>=1.11"]

[project.scripts]
engassist = "engassist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engassist"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["evals/practice_repo", "evals/hidden_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "BLE"]
